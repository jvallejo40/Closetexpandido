<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Emocional — El Closet Expandido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --bg-color: #000000;
            --card-bg: #ffffff;
            --accent: #ffffff;
            --text-light: #fdfaf4;
            --text-muted: #aaaaaa;
            --panel-bg: rgba(0, 0, 0, 0.6);
            --border-glow: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
            overflow: hidden;
        }

        #universe-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            cursor: grab;
        }

        /* Contenedor principal de la interfaz para manejo de visibilidad post-carga */
        #main-ui {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        #main-ui.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .exit-button {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 22px;
            height: 22px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 80;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
        }

        .exit-button:hover {
            background: white;
            color: black;
            transform: scale(1.1);
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 20px 30px 20px 65px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .header > * { pointer-events: auto; }

        .logo-area h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #aaaaaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-item { text-align: center; }

        .stat-item .num {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--accent);
            font-family: 'Montserrat', sans-serif;
        }

        .stat-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .panel-toggle {
            position: fixed;
            z-index: 90;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(15px);
        }
        .panel-toggle:hover { background: var(--accent); color: var(--bg-deep); }
        
        #sidebarToggle { top: 95px; left: 25px; }

        .close-panel-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s;
        }
        .close-panel-btn:hover { color: var(--text-light); }

        .sidebar {
            position: fixed;
            left: 0;
            right: auto;
            top: 50%;
            transform: translateX(-120%) translateY(-50%);
            z-index: 100;
            padding: 40px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--panel-bg);
            border-radius: 0 16px 16px 0;
            border: 1px solid var(--border-glow);
            border-left: none;
            backdrop-filter: blur(25px);
            max-height: 85vh;
            width: 280px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sidebar.open {
            transform: translateX(0) translateY(-50%);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-title {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--text-light);
        }

        .chip.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            color: var(--text-light);
        }

        .chip-count {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-left: 4px;
        }

        .emotion-list-container {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .emotion-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.68rem;
            transition: all 0.3s;
        }

        .emotion-btn:hover, .emotion-btn.active {
            border-color: var(--border-glow);
            color: var(--text-light);
            background: rgba(255,255,255,0.08);
        }

        .emotion-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .emotion-count {
            margin-left: auto;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .insight-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateX(120%) translateY(-50%);
            z-index: 100;
            width: 360px;
            max-width: 90vw;
            height: 85vh;
            overflow-y: auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-right: none;
            border-radius: 16px 0 0 16px;
            padding: 30px 24px 80px 24px;
            backdrop-filter: blur(25px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        .insight-panel::-webkit-scrollbar { width: 4px; }
        .insight-panel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .insight-panel.visible { transform: translateX(0) translateY(-50%); }

        .insight-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            margin-bottom: 24px;
        }

        .insight-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 1.8rem;
            margin: 0;
            line-height: 1.1;
        }

        .insight-header .frequency {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .insight-nav-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            z-index: 105;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .insight-nav-container.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            color: var(--text-light);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .nav-btn:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
        }

        .insight-nav-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }
        @media (min-width: 768px) { .insight-nav-text { display: block; } }

        .insight-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .insight-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .insight-card h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .insight-bar-container { display: flex; flex-direction: column; gap: 6px; }
        .insight-bar-row { display: flex; align-items: center; gap: 8px; }
        .insight-bar-label { font-size: 0.7rem; width: 80px; flex-shrink: 0; color: var(--text-muted); }
        .insight-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
        .insight-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .insight-bar-value { font-size: 0.7rem; font-weight: 600; width: 30px; text-align: right; }

        .context-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .context-tag {
            font-size: 0.65rem; padding: 4px 10px; border-radius: 12px;
            background: rgba(255,255,255,0.08); color: var(--accent); border: 1px solid rgba(255,255,255,0.1);
        }

        .tooltip {
            position: fixed;
            z-index: 150;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, top 0.1s, left 0.1s;
            backdrop-filter: blur(10px);
        }

        .tooltip.visible { opacity: 1; }
        .tooltip .tt-name { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 500; text-transform: uppercase; }
        .tooltip .tt-count { font-size: 0.7rem; color: var(--text-muted); }

        .data-mode {
            position: fixed; bottom: 16px; right: 20px; z-index: 100;
            font-size: 0.6rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.6); padding: 8px 14px; border-radius: 20px;
            border: 1px solid var(--border-glow); backdrop-filter: blur(10px);
            transition: all 0.3s;
            cursor: default; /* Cambiado a default ya que no hace nada al clic */
        }
        .data-mode .dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; }
        .data-mode .dot.live { background: #4caf50; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        @media (max-width: 768px) {
            .stats-bar { display: none; }
            #sidebarToggle { top: auto; bottom: 80px; left: 16px; }
            .exit-button { left: 15px; top: 15px; width: 22px; height: 22px; font-size: 0.6rem; }
            .header { padding-left: 45px; }
            .sidebar { 
                top: auto; bottom: 80px; left: 10px; right: auto; transform: translateY(150%); max-width: calc(100% - 20px);
                max-height: 60vh; width: 100%; border-radius: 16px; border: 1px solid var(--border-glow);
            }
            .sidebar.open { transform: translateY(0); }
            .insight-panel {
                top: auto; bottom: 0; left: 50%; right: auto;
                transform: translateX(-50%) translateY(100%);
                width: 100%; max-width: 100%; height: 65vh;
                border-radius: 20px 20px 0 0;
                padding: 24px 20px 80px 24px;
                border: 1px solid var(--border-glow);
                border-bottom: none;
            }
            .insight-panel.visible { transform: translateX(-50%) translateY(0); }
            .header { padding: 12px 16px 12px 45px; }
            .logo-area h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <canvas id="universe-canvas"></canvas>

    <!-- Contenedor de la Interfaz que se activa al terminar la carga -->
    <div id="main-ui">
        <a href="javascript:history.back()" class="exit-button" title="Volver a la página anterior">✕</a>

        <div class="header">
            <div class="logo-area">
                <h1>Universo Emocional</h1>
                <p>El Closet Expandido — Circuito Cuerpo/Espacio</p>
            </div>
            <div class="stats-bar" id="statsBar">
                <div class="stat-item"><div class="num" id="statParticipants">0</div><div class="label">Participantes</div></div>
                <div class="stat-item"><div class="num" id="statEmotions">0</div><div class="label">Emociones</div></div>
            </div>
        </div>

        <button class="panel-toggle" id="sidebarToggle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
            Filtros
        </button>

        <div class="sidebar" id="sidebar"></div>

        <div class="tooltip" id="tooltip">
            <div class="tt-name" id="ttName"></div>
            <div class="tt-count" id="ttCount"></div>
        </div>

        <div class="insight-nav-container" id="insightNav">
            <button id="prevInsightBtn" class="nav-btn" title="Emoción anterior">◄</button>
            <span class="insight-nav-text">Navegar con ← →</span>
            <button id="nextInsightBtn" class="nav-btn" title="Siguiente emoción">►</button>
        </div>

        <div class="insight-panel" id="insightPanel">
            <button class="close-panel-btn" id="closeInsight">✕</button>
            <div class="insight-header">
                <h2 id="insightTitle">—</h2>
                <div class="frequency" id="insightFreq"></div>
            </div>
            <div class="insight-grid" id="insightGrid"></div>
        </div>

        <button class="data-mode" id="dataModeBtn" title="Datos de la experiencia">
            <div class="dot" id="dataModeDot"></div>
            <span id="dataModeLabel">Modo Demo</span>
        </button>
    </div>

    <script>
    /**
     * RECURSOS Y VARIABLES DEL CARGADOR
     */
    const LOGO_URL = 'https://www.jaimesiva.com/wp-content/uploads/2026/04/Icono-Closet-Blanco.png';
    const imgLogoCargador = new Image();
    imgLogoCargador.src = LOGO_URL;

    let estado = 'cargando'; // 'cargando' o 'activo'
    let progresoCarga = 0;
    let objetivoCarga = 0; 
    let particulasCarga = [];

    // Generar partículas de fondo para el cargador
    for(let i=0; i<100; i++) {
        particulasCarga.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
            tamano: Math.random() * 2 + 0.5
        });
    }

    /**
     * LÓGICA DE RENDERIZADO DEL CARGADOR
     */
    function ejecutarCargador(ctx, canvas) {
        // 1. Calcular progresión suave
        progresoCarga += (objetivoCarga - progresoCarga) * 0.05;
        
        // 2. Manejo de opacidad para transición fluida al terminar
        let opacidadCarga = 1;
        if (objetivoCarga === 100 && progresoCarga > 90) {
            opacidadCarga = Math.max(0, (100 - progresoCarga) / 10);
        }
        
        ctx.globalAlpha = opacidadCarga;

        // Limpiar fondo para el cargador (negro sólido)
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 3. Dibujar partículas de ambiente
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        particulasCarga.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
            ctx.fillRect(p.x, p.y, p.tamano, p.tamano);
        });

        // 4. Dibujar Logo Centrado
        if (imgLogoCargador.complete) {
            const logoW = window.innerWidth < 768 ? 100 : 150;
            const logoH = (imgLogoCargador.height * logoW) / imgLogoCargador.width;
            ctx.drawImage(
                imgLogoCargador, 
                (canvas.width - logoW) / 2, 
                (canvas.height - logoH) / 2 - 40, 
                logoW, 
                logoH
            );
        }

        // 5. Texto de progreso (Debajo del logo)
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // "CARGANDO UNIVERSO" como clave
        ctx.font = '600 14px Montserrat';
        ctx.fillText(
            "CARGANDO UNIVERSO", 
            canvas.width / 2, 
            canvas.height / 2 + 50
        );

        ctx.font = '400 11px Montserrat';
        ctx.fillText(
            `[ SINTETIZANDO MEMBRANA: ${Math.floor(progresoCarga)}% ]`, 
            canvas.width / 2, 
            canvas.height / 2 + 75
        );
        
        ctx.globalAlpha = 1.0;

        // 6. Cambio de estado al completar
        if (progresoCarga > 99.5 && objetivoCarga === 100) {
            estado = 'activo';
            document.getElementById('main-ui').classList.add('visible');
        }
    }

    // Configuración y Diccionarios
    const EMOTION_COLORS = {
        'Amor': '#e85d75', 'Nostalgia': '#7b8cc4', 'Miedo': '#5c4a72', 'Alegría': '#f5c542',
        'Tristeza': '#4a7fa5', 'Esperanza': '#7ecba1', 'Orgullo': '#d4a03c', 'Vergüenza': '#c47a8f',
        'Libertad': '#42c6b5', 'Soledad': '#6b5b8a', 'Gratitud': '#e8a87c', 'Rabia': '#c0392b',
        'Ternura': '#f0b6c2', 'Confusión': '#9b8ec4', 'Resiliencia': '#d4915e', 'Aceptación': '#8bc48b',
        'Culpa': '#8a6d5e', 'Ansiedad': '#a3738c', 'Empatía': '#d4a6d4', 'Valentía': '#e07b4f',
        'Melancolía': '#6a7fa8', 'Deseo': '#c75a3e', 'Paz': '#89c4b8', 'Vulnerabilidad': '#b8a3c7',
        'Pertenencia': '#8ab87a', 'Rebeldía': '#e05656', 'Asombro': '#d4c456', 'Frustración': '#a05a5a',
    };

    const EMOTION_LEXICON = {
        'Amor': ['amor', 'amar', 'amaba', 'amé', 'enamorar', 'querer', 'cariño', 'pasión', 'corazón', 'ternura'],
        'Nostalgia': ['nostalgia', 'añorar', 'extrañar', 'recuerdo', 'recordar', 'pasado', 'infancia'],
        'Miedo': ['miedo', 'temer', 'terror', 'pánico', 'asustar', 'angustia', 'pavor'],
        'Alegría': ['alegría', 'alegre', 'feliz', 'felicidad', 'gozo', 'risa', 'sonrisa', 'ilusión'],
        'Tristeza': ['tristeza', 'triste', 'llorar', 'llanto', 'lágrimas', 'pena', 'dolor', 'sufrir'],
        'Esperanza': ['esperanza', 'esperar', 'optimismo', 'soñar', 'futuro', 'fe', 'creer'],
        'Orgullo': ['orgullo', 'orgulloso', 'dignidad', 'logro', 'éxito', 'triunfo'],
        'Vergüenza': ['vergüenza', 'avergonzar', 'bochorno', 'humillación', 'pudor'],
        'Libertad': ['libertad', 'libre', 'liberar', 'independencia', 'autonomía', 'volar'],
        'Soledad': ['soledad', 'solo', 'sola', 'aislamiento', 'aislado', 'vacío'],
        'Gratitud': ['gratitud', 'agradecer', 'gracias', 'reconocer', 'valorar'],
        'Rabia': ['rabia', 'ira', 'furia', 'enojo', 'enojar', 'indignación', 'enfado'],
        'Ternura': ['ternura', 'tierno', 'tierna', 'dulzura', 'mimar', 'cuidar'],
        'Resiliencia': ['resiliencia', 'fortaleza', 'fuerte', 'resistir', 'superar', 'luchar'],
        'Aceptación': ['aceptar', 'reconciliar', 'comprender', 'tolerar', 'perdonar'],
        'Confusión': ['confusión', 'confundido', 'desorientado', 'perdido', 'duda', 'caos'],
        'Vulnerabilidad': ['vulnerabilidad', 'vulnerable', 'frágil', 'fragilidad', 'débil', 'indefenso', 'sensible'],

    function parseCSVToParticipants(csv) {
        const rows = parseCSV(csv);
        if (rows.length < 2) return [];
        const headers = rows[0].map(h => h.toLowerCase().trim().replace(/[""]/g, ''));
        const findCol = (p) => headers.findIndex(h => p.some(x => h.includes(x)));
        
        const gIdx = findCol(['gender', 'género', 'genero', 'sexo']), 
              aIdx = findCol(['age', 'edad']), 
              lIdx = findCol(['location', 'ubicación', 'lugar']), 
              sIdx = findCol(['story', 'historia', 'narrativa']), 
              eAIdx = findCol(['análisis', 'analisis']), 
              ePIdx = findCol(['poética', 'poetica']),
              oIdx = findCol(['orientation', 'orientación', 'orientacion']), 
              dIdx = findCol(['dimensión', 'dimension', 'contexto']),
              fIdx = findCol(['fragmentos']); 
        
        const participants = [];
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i]; 
            if (row.every(c => !c || c.trim() === '')) continue;
            const textToAnalyze = (row[ePIdx]||'') + ' ' + (row[eAIdx]||'') + ' ' + (row[sIdx]||'');
            const emotions = [...new Set(extractEmotionsDeep(textToAnalyze))];
            
            const contextRaw = dIdx !== -1 && row[dIdx] ? row[dIdx].trim() : 'General';
            const orientationRaw = oIdx !== -1 && row[oIdx] ? row[oIdx].trim() : 'No Especificado';

            let fragmentText = '';
            if (fIdx !== -1 && row[fIdx]) {
                fragmentText = row[fIdx].trim();
            }

            participants.push({ 
                id: i, 
                gender: (row[gIdx]||'').toLowerCase().includes('fem')?'Femenino':((row[gIdx]||'').toLowerCase().includes('masc')?'Masculino':'Otro'), 
                ageGroup: classifyAgeGroup(row[aIdx]), 
                location: row[lIdx] || 'Desconocida', 
                orientation: orientationRaw,
                contexts: [contextRaw], 
                emotions: emotions.length ? emotions : ['Sin clasificar'], 
                sampleText: fragmentText 
            });
        }
        return participants;
    }

    function classifyAgeGroup(a) { 
        const age = parseInt(a); 
        if (isNaN(age)) return 'Desconocida'; 
        if (age < 18) return '15-17'; 
        if (age <= 25) return '18-25'; 
        if (age <= 35) return '26-35'; 
        if (age <= 45) return '36-45'; 
        if (age <= 55) return '46-55'; 
        return '56+'; 
    }

    function extractEmotionsDeep(t) { 
        const f = [], l = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); 
        for (const [e, k] of Object.entries(EMOTION_LEXICON)) { 
            for (const kw of k) { 
                if (new RegExp('\\b' + kw.normalize('NFD').replace(/[\u0300-\u036f]/g, '') + '\\b', 'i').test(l)) { 
                    f.push(e); 
                    break; 
                } 
            } 
        } 
        return f; 
    }

    function parseCSV(t) { 
        const r = []; let c = [], cl = '', q = false; 
        for (let i = 0; i < t.length; i++) { 
            const ch = t[i]; 
            if (q) { 
                if (ch === '"' && t[i+1] === '"') { cl += '"'; i++; } 
                else if (ch === '"') q = false; 
                else cl += ch; 
            } else { 
                if (ch === '"') q = true; 
                else if (ch === ',') { c.push(cl); cl = ''; } 
                else if (ch === '\n' || ch === '\r') { 
                    if (ch === '\r' && t[i+1] === '\n') i++; 
                    c.push(cl); cl = ''; 
                    if (c.some(x => x.trim())) r.push(c); 
                    c = []; 
                } else cl += ch; 
            } 
        } 
        c.push(cl); if (c.some(x => x.trim())) r.push(c); 
        return r; 
    }

            }

    }

        const validFragments = e.sampleTexts.filter(t => t && t.trim() !== '');
        if (validFragments.length) {
            html += `<div class="insight-card"><h4>Fragmentos</h4><div style="display:flex;flex-direction:column;gap:8px;">${validFragments.map(t => `<p style="font-size:0.7rem;color:var(--text-muted);line-height:1.6;padding:8px;background:rgba(255,255,255,0.03);border-left:2px solid ${c};font-style:italic;">"${t}"</p>`).join('')}</div></div>`;
        }
        
        document.getElementById('insightGrid').innerHTML = html; p.classList.add('visible'); document.getElementById('insightNav').classList.add('visible'); selectedEmotion = e.name; updateEmotionListSidebar(currentAggregatedData.emotions);
    }
    
    function makeBar(l, v, t, c) { const p = t>0?(v/t*100):0; return `<div class="insight-bar-row"><span class="insight-bar-label">${l}</span><div class="insight-bar-track"><div class="insight-bar-fill" style="width:${p}%;background:${c}"></div></div><span class="insight-bar-value">${v}</span></div>`; }
    function hideInsight() { document.getElementById('insightPanel').classList.remove('visible'); document.getElementById('insightNav').classList.remove('visible'); selectedEmotion = null; updateEmotionListSidebar(currentAggregatedData.emotions); }
    function navigateInsight(d) { const ems = currentAggregatedData.emotions; const i = ems.findIndex(e => e.name === selectedEmotion); if (i === -1) return; let ni = (i+d+ems.length)%ems.length; showInsight(ems[ni], getEmotionColor(ems[ni].name)); }
    
    document.getElementById('prevInsightBtn').onclick = () => navigateInsight(-1);
    document.getElementById('nextInsightBtn').onclick = () => navigateInsight(1);
    document.getElementById('closeInsight').onclick = hideInsight;
    document.getElementById('sidebarToggle').onclick = () => document.getElementById('sidebar').classList.add('open');

    // Inicialización
    resize();
    animLoop();

    (async function boot() {
        globalRawParticipants = generateDemoParticipants();
        applyFilters();
        buildSidebarUI();
        
        try {
            const liveParticipants = await loadFromCSVUrl(LIVE_CSV_URL);
            if (liveParticipants && liveParticipants.length > 0) {
                globalRawParticipants = liveParticipants;
                applyFilters();
                buildSidebarUI();
                document.getElementById('dataModeDot').classList.add('live');
                document.getElementById('dataModeLabel').textContent = `En Vivo: N=${globalRawParticipants.length}`;
            }
        } catch (e) {
            console.warn('⚠️ No se pudo conectar a la hoja en vivo, usando demo.');
        }

        // Simular tiempo de carga para la transición visual
        setTimeout(() => {
            objetivoCarga = 100;
        }, 1500);
    })();
    </script>
</body>
</html>
