<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Emocional — El Closet Expandido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --bg-color: #000000;
            --card-bg: #ffffff;
            --accent: #ffffff;
            --text-light: #fdfaf4;
            --text-muted: #aaaaaa;
            --panel-bg: rgba(0, 0, 0, 0.6);
            --border-glow: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
            overflow: hidden;
        }

        /* ─── CANVAS ─── */
        #universe-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            cursor: grab;
        }

        /* ─── BOTÓN VOLVER (X) ─── */
        .exit-button {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 22px;
            height: 22px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 80;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
        }

        .exit-button:hover {
            background: white;
            color: black;
            transform: scale(1.1);
        }

        /* ─── HEADER ─── */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 20px 30px 20px 65px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .header > * { pointer-events: auto; }

        .logo-area h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #aaaaaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-item { text-align: center; }

        .stat-item .num {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--accent);
            font-family: 'Montserrat', sans-serif;
        }

        .stat-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        /* ─── TOGGLE BUTTONS & CLOSE BTNS ─── */
        .panel-toggle {
            position: fixed;
            z-index: 90;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(15px);
        }
        .panel-toggle:hover { background: var(--accent); color: var(--bg-deep); }
        
        #sidebarToggle { top: 95px; left: 25px; }

        .close-panel-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s;
        }
        .close-panel-btn:hover { color: var(--text-light); }

        /* ─── CONFIG PANEL ─── */
        .config-panel {
            position: fixed;
            top: 60px;
            right: 30px;
            z-index: 200;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 40px 24px 24px 24px;
            width: 380px;
            display: none;
            backdrop-filter: blur(20px);
        }

        .config-panel.active { display: block; }

        .config-panel h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .config-panel p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .config-panel input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 0.8rem;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 8px;
        }

        .config-panel .btn-connect {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #333333, #000000);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .config-panel .btn-connect:hover { opacity: 0.85; }

        /* ─── ENHANCED SIDEBAR WITH FILTERS (LEFT SIDE) ─── */
        .sidebar {
            position: fixed;
            left: 0;
            right: auto;
            top: 50%;
            transform: translateX(-120%) translateY(-50%);
            z-index: 100;
            padding: 40px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--panel-bg);
            border-radius: 0 16px 16px 0;
            border: 1px solid var(--border-glow);
            border-left: none;
            backdrop-filter: blur(25px);
            max-height: 85vh;
            width: 280px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sidebar.open {
            transform: translateX(0) translateY(-50%);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-title {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--text-light);
        }

        .chip.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            color: var(--text-light);
        }

        .chip .chip-count {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-left: 4px;
        }

        .emotion-list-container {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .emotion-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.68rem;
            transition: all 0.3s;
        }

        .emotion-btn:hover, .emotion-btn.active {
            border-color: var(--border-glow);
            color: var(--text-light);
            background: rgba(255,255,255,0.08);
        }

        .emotion-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .emotion-count {
            margin-left: auto;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* ─── INSIGHT PANEL (RIGHT SIDE) ─── */
        .insight-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateX(120%) translateY(-50%);
            z-index: 100;
            width: 360px;
            max-width: 90vw;
            height: 85vh;
            overflow-y: auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-right: none;
            border-radius: 16px 0 0 16px;
            padding: 30px 24px 80px 24px;
            backdrop-filter: blur(25px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        .insight-panel::-webkit-scrollbar { width: 4px; }
        .insight-panel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .insight-panel.visible { transform: translateX(0) translateY(-50%); }

        .insight-panel .close-panel-btn {
            top: 16px;
            right: 16px;
        }

        .insight-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            margin-bottom: 24px;
        }

        .insight-planet-dot {
            display: none;
        }

        .insight-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 1.8rem;
            margin: 0;
            line-height: 1.1;
        }

        .insight-header .frequency {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ─── INSIGHT NAV (BOTTOM FIXED) ─── */
        .insight-nav-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            z-index: 105;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .insight-nav-container.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            color: var(--text-light);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .nav-btn:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
        }

        /* ─── INSIGHT GRID ─── */
        .insight-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .insight-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .insight-card h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .insight-bar-container { display: flex; flex-direction: column; gap: 6px; }
        .insight-bar-row { display: flex; align-items: center; gap: 8px; }
        .insight-bar-label { font-size: 0.7rem; width: 80px; flex-shrink: 0; color: var(--text-muted); }
        .insight-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
        .insight-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .insight-bar-value { font-size: 0.7rem; font-weight: 600; width: 30px; text-align: right; }

        .context-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .context-tag {
            font-size: 0.65rem; padding: 4px 10px; border-radius: 12px;
            background: rgba(255,255,255,0.08); color: var(--accent); border: 1px solid rgba(255,255,255,0.1);
        }

        /* ─── TOOLTIP ─── */
        .tooltip {
            position: fixed;
            z-index: 150;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, top 0.1s, left 0.1s;
            backdrop-filter: blur(10px);
        }

        .tooltip.visible { opacity: 1; }
        .tooltip .tt-name { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 500; text-transform: uppercase; }
        .tooltip .tt-count { font-size: 0.7rem; color: var(--text-muted); }

        /* ─── LOADING ─── */
        .loading-overlay {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg-deep);
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-overlay h2 {
            font-family: 'Montserrat', sans-serif; font-size: 2.5rem; margin-bottom: 8px; font-weight: 500; text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #aaaaaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .loading-overlay p { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 2px; }
        .loading-ring {
            width: 50px; height: 50px; border: 2px solid var(--border-glow); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite; margin-top: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── DATA MODE INDICATOR ─── */
        .data-mode {
            position: fixed; bottom: 16px; right: 20px; z-index: 100;
            font-size: 0.6rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.6); padding: 8px 14px; border-radius: 20px;
            border: 1px solid var(--border-glow); cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .data-mode:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-light); }
        .data-mode .dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; }
        .data-mode .dot.live { background: #4caf50; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        @media (max-width: 768px) {
            .stats-bar { display: none; }
            #sidebarToggle { top: auto; bottom: 80px; left: 16px; }
            .exit-button { left: 15px; top: 15px; width: 22px; height: 22px; font-size: 0.6rem; }
            .header { padding-left: 45px; }
            .sidebar { 
                top: auto; bottom: 80px; left: 10px; right: auto; transform: translateY(150%); max-width: calc(100% - 20px);
                max-height: 60vh; width: 100%; border-radius: 16px; border: 1px solid var(--border-glow);
            }
            .sidebar.open { transform: translateY(0); }
            .insight-panel {
                top: auto; bottom: 0; left: 50%; right: auto;
                transform: translateX(-50%) translateY(100%);
                width: 100%; max-width: 100%; height: 65vh;
                border-radius: 20px 20px 0 0;
                padding: 24px 20px 80px 24px;
                border: 1px solid var(--border-glow);
                border-bottom: none;
            }
            .insight-panel.visible { transform: translateX(-50%) translateY(0); }
            .header { padding: 12px 16px 12px 45px; }
            .logo-area h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <h2>Universo Emocional</h2>
        <p>El Closet Expandido</p>
        <div class="loading-ring"></div>
    </div>

    <a href="javascript:history.back()" class="exit-button" title="Volver a la página anterior">✕</a>

    <canvas id="universe-canvas"></canvas>

    <div class="header">
        <div class="logo-area">
            <h1>Universo Emocional</h1>
            <p>El Closet Expandido — Circuito Cuerpo/Espacio</p>
        </div>
        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><div class="num" id="statParticipants">0</div><div class="label">Participantes</div></div>
            <div class="stat-item"><div class="num" id="statEmotions">0</div><div class="label">Emociones</div></div>
        </div>
    </div>

    <button class="panel-toggle" id="sidebarToggle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        Filtros
    </button>

    <div class="config-panel" id="configPanel">
        <button class="close-panel-btn" id="closeConfig">✕</button>
        <h3>Conectar Base de Datos</h3>
        <p>Ingresa la URL del CSV o el ID del spreadsheet.</p>
        <input type="text" id="sheetId" placeholder="URL del CSV o ID del Google Sheet">
        <input type="text" id="sheetName" placeholder="Nombre de la hoja (ej: Sheet1)" value="Sheet1">
        <button class="btn-connect" id="btnConnect">Conectar y Cargar Datos</button>
        <div class="status" id="connStatus"></div>
    </div>

    <div class="sidebar" id="sidebar"></div>

    <div class="tooltip" id="tooltip">
        <div class="tt-name" id="ttName"></div>
        <div class="tt-count" id="ttCount"></div>
    </div>

    <div class="insight-nav-container" id="insightNav">
        <button id="prevInsightBtn" class="nav-btn" title="Anterior">◄</button>
        <span class="insight-nav-text" style="font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted)">Navegar</span>
        <button id="nextInsightBtn" class="nav-btn" title="Siguiente">►</button>
    </div>

    <div class="insight-panel" id="insightPanel">
        <button class="close-panel-btn" id="closeInsight">✕</button>
        <div class="insight-header">
            <div class="insight-planet-dot" id="insightDot"></div>
            <h2 id="insightTitle">—</h2>
            <div class="frequency" id="insightFreq"></div>
        </div>
        <div class="insight-grid" id="insightGrid"></div>
    </div>

    <button class="data-mode" id="dataModeBtn" title="Configurar Conexión">
        <div class="dot" id="dataModeDot"></div>
        <span id="dataModeLabel">Datos de demostración</span>
    </button>

    <script>
    const EMOTION_COLORS = {
        'Amor': '#e85d75', 'Nostalgia': '#7b8cc4', 'Miedo': '#5c4a72', 'Alegría': '#f5c542',
        'Tristeza': '#4a7fa5', 'Esperanza': '#7ecba1', 'Orgullo': '#d4a03c', 'Vergüenza': '#c47a8f',
        'Libertad': '#42c6b5', 'Soledad': '#6b5b8a', 'Gratitud': '#e8a87c', 'Rabia': '#c0392b',
        'Ternura': '#f0b6c2', 'Confusión': '#9b8ec4', 'Resiliencia': '#d4915e', 'Aceptación': '#8bc48b',
        'Culpa': '#8a6d5e', 'Ansiedad': '#a3738c', 'Empatía': '#d4a6d4', 'Valentía': '#e07b4f',
        'Melancolía': '#6a7fa8', 'Deseo': '#c75a3e', 'Paz': '#89c4b8', 'Vulnerabilidad': '#b8a3c7',
        'Pertenencia': '#8ab87a', 'Rebeldía': '#e05656', 'Asombro': '#d4c456', 'Frustración': '#a05a5a',
    };

    const EMOTION_LEXICON = {
        'Amor': ['amor', 'amar', 'amaba', 'amé', 'enamorar', 'querer', 'cariño', 'pasión', 'corazón', 'ternura'],
        'Nostalgia': ['nostalgia', 'añorar', 'extrañar', 'recuerdo', 'recordar', 'pasado', 'infancia'],
        'Miedo': ['miedo', 'temer', 'terror', 'pánico', 'asustar', 'angustia', 'pavor'],
        'Alegría': ['alegría', 'alegre', 'feliz', 'felicidad', 'gozo', 'risa', 'sonrisa', 'ilusión'],
        'Tristeza': ['tristeza', 'triste', 'llorar', 'llanto', 'lágrimas', 'pena', 'dolor', 'sufrir'],
        'Esperanza': ['esperanza', 'esperar', 'optimismo', 'soñar', 'futuro', 'fe', 'creer'],
        'Orgullo': ['orgullo', 'orgulloso', 'dignidad', 'logro', 'éxito', 'triunfo'],
        'Vergüenza': ['vergüenza', 'avergonzar', 'bochorno', 'humillación', 'pudor'],
        'Libertad': ['libertad', 'libre', 'liberar', 'independencia', 'autonomía', 'volar'],
        'Soledad': ['soledad', 'solo', 'sola', 'aislamiento', 'aislado', 'vacío'],
        'Gratitud': ['gratitud', 'agradecer', 'gracias', 'reconocer', 'valorar'],
        'Rabia': ['rabia', 'ira', 'furia', 'enojo', 'enojar', 'indignación', 'enfado'],
        'Ternura': ['ternura', 'tierno', 'tierna', 'dulzura', 'mimar', 'cuidar'],
        'Resiliencia': ['resiliencia', 'fortaleza', 'fuerte', 'resistir', 'superar', 'luchar'],

    document.getElementById('dataModeBtn').onclick = () => document.getElementById('configPanel').classList.add('active');
    document.getElementById('closeConfig').onclick = () => document.getElementById('configPanel').classList.remove('active');
    document.getElementById('sidebarToggle').onclick = () => document.getElementById('sidebar').classList.add('open');

    document.getElementById('btnConnect').onclick = async () => {
        let i = document.getElementById('sheetId').value.trim(), n = document.getElementById('sheetName').value.trim()||'Sheet1', s = document.getElementById('connStatus');
        if (!i) { s.className = 'status error'; s.textContent = 'Ingresa ID o URL'; return; }
        let url = i.startsWith('http') ? (i.includes('output=csv')?i:i+'&output=csv') : `https://docs.google.com/spreadsheets/d/${i}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`;
        s.className = 'status'; s.style.display = 'block'; s.textContent = 'Conectando...';
        try {
            globalRawParticipants = await loadFromCSVUrl(url);
            activeFilters = { gender: null, ageGroup: null, location: null, context: null };
            applyFilters(); buildSidebarUI();
            s.className = 'status success'; s.textContent = `Conectado: ${globalRawParticipants.length} registros.`;
            document.getElementById('dataModeDot').classList.add('live');
            document.getElementById('dataModeLabel').textContent = `Vivo: N=${globalRawParticipants.length}`;
            setTimeout(() => document.getElementById('configPanel').classList.remove('active'), 2000);
        } catch (e) { s.className = 'status error'; s.textContent = e.message; }
    };

    resize();
    (async function boot() {
        globalRawParticipants = generateDemoParticipants();
        applyFilters(); buildSidebarUI();
        document.getElementById('sidebar').classList.add('open');
        drawFrame();
        try {
            const liveParticipants = await loadFromCSVUrl(LIVE_CSV_URL);
            if (liveParticipants && liveParticipants.length > 0) {
                globalRawParticipants = liveParticipants;
                applyFilters(); buildSidebarUI();
                document.getElementById('dataModeDot').classList.add('live');
                document.getElementById('dataModeLabel').textContent = `Vivo: N=${globalRawParticipants.length}`;
            }
        } catch (e) { console.warn('⚠️ Fallback a demo:', e.message); }
        setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 1200);
    })();
    </script>
</body>
</html>
