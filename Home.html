<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Vivo: Hero Transmutado</title>
    
    <!-- Importamos Montserrat (400 para texto normal, 700 para negrita y 900 para títulos) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Espacio académico: Configuración del entorno base */
        :root {
            --color-fondo: #0a0a0a;
            --color-texto: #e0e0e0;
            --color-acento: #ffffff;
            --nav-height: 100px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        /* ==========================================
           ARQUITECTURA DE NAVEGACIÓN
           ========================================== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            box-sizing: border-box;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        nav.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            z-index: 1100;
        }

        .nav-logo img {
            max-height: 80px;
            width: auto;
            object-fit: contain;
        }

        .nav-enlaces {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-enlaces li a {
            color: var(--color-texto);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .nav-enlaces li a:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .btn-menu {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1100;
            padding: 10px;
        }

        .btn-menu span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--color-texto);
            margin: 5px 0;
            transition: 0.4s;
        }

        .btn-menu.open span:nth-child(1) { transform: rotate(-45deg) translate(-5px, 5px); }
        .btn-menu.open span:nth-child(2) { opacity: 0; }
        .btn-menu.open span:nth-child(3) { transform: rotate(45deg) translate(-5px, -5px); }

        @media (max-width: 768px) {
            :root { --nav-height: 80px; }
            .nav-logo img { max-height: 60px; }
            .btn-menu { display: block; }
            .nav-enlaces {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background: rgba(10, 10, 10, 0.6);
                backdrop-filter: blur(15px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 3rem;
                transform: translateY(-100%);
                transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
                pointer-events: none;
            }
            .nav-enlaces.open {
                transform: translateY(0);
                pointer-events: auto;
            }
            .nav-enlaces li a {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
        }

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: crosshair;
        }

        #canvas-espacio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <nav id="menu-principal">
        <div class="nav-logo">
            <img src="https://www.jaimesiva.com/wp-content/uploads/2026/04/Icono-Closet-Blanco.png" alt="Icono Closet Blanco">
        </div>
        
        <button class="btn-menu" id="toggle-menu" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-enlaces" id="enlaces-nav">
            <li><a href="#" class="link-menu">Umbral</a></li>
            <li><a href="#" class="link-menu">Manifiesto</a></li>
            <li><a href="#" class="link-menu">Procesos</a></li>
            <li><a href="#" class="link-menu">Contacto</a></li>
        </ul>
    </nav>

    <header class="hero">
        <canvas id="canvas-espacio"></canvas>
    </header>

    <script>
        const canvas = document.getElementById('canvas-espacio');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const heroSection = document.querySelector('.hero');
        const menuPrincipal = document.getElementById('menu-principal');
        const btnMenu = document.getElementById('toggle-menu');
        const enlacesNav = document.getElementById('enlaces-nav');
        const linksMenu = document.querySelectorAll('.link-menu');

        // Recursos del Cargador
        const LOGO_URL = 'https://www.jaimesiva.com/wp-content/uploads/2026/04/Icono-Closet-Blanco.png';
        const imgLogoCargador = new Image();
        imgLogoCargador.src = LOGO_URL;

        let particulas = [];
        let animacionId;
        let estado = 'cargando';
        let progresoCarga = 0;
        let objetivoCarga = 0;
        let particulasCarga = [];
        let opacidadTransicion = 0;

        let boundsSecreto = { x: 0, y: 0, w: 0, h: 0 };
        const LINK_UNIVERSO = "https://jvallejo40.github.io/Closetexpandido/universo-emocional.html";

        btnMenu.addEventListener('click', () => {
            btnMenu.classList.toggle('open');
            enlacesNav.classList.toggle('open');
        });

        linksMenu.forEach(link => {
            link.addEventListener('click', () => {
                btnMenu.classList.remove('open');
                enlacesNav.classList.remove('open');
            });
        });

        for(let i=0; i<100; i++) {
            particulasCarga.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                tamano: Math.random() * 2 + 0.5
            });
        }
        
        const raton = { x: null, y: null, radio: window.innerWidth < 768 ? 80 : 110 };

        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            raton.radio = window.innerWidth < 768 ? 80 : 110;
            actualizarPosicionSecreto();
            if (estado === 'activo') manifestarDesdeURL(RUTA_IMAGEN);
        }
        window.addEventListener('resize', redimensionarCanvas);

        const handleInteraction = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            raton.x = clientX - rect.left;
            raton.y = clientY - rect.top;
            
            if (estado === 'activo' && isOverSecreto(raton.x, raton.y)) {
                heroSection.style.cursor = 'pointer';
            } else {
                heroSection.style.cursor = 'crosshair';
            }
        };

        heroSection.addEventListener('mousemove', handleInteraction);
        heroSection.addEventListener('touchstart', handleInteraction);
        heroSection.addEventListener('touchmove', handleInteraction);
        heroSection.addEventListener('mouseout', () => { raton.x = null; raton.y = null; });
        heroSection.addEventListener('touchend', () => { raton.x = null; raton.y = null; });

        canvas.addEventListener('click', (e) => {
            if (estado === 'activo') {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                if (isOverSecreto(clickX, clickY)) window.location.href = LINK_UNIVERSO;
            }
        });

        function isOverSecreto(x, y) {
            if (x === null || y === null) return false;
            return (x >= boundsSecreto.x - boundsSecreto.w/2 && x <= boundsSecreto.x + boundsSecreto.w/2 &&
                    y >= boundsSecreto.y - boundsSecreto.h/2 && y <= boundsSecreto.y + boundsSecreto.h/2);
        }

        function actualizarPosicionSecreto() {
            boundsSecreto.x = canvas.width / 2;
            boundsSecreto.y = canvas.height / 2;
        }

        class Particula {
            constructor(xOriginal, yOriginal, xBase, yBase, color, tamano) {
                this.x = xOriginal;
                this.y = yOriginal;
                this.baseX = xBase;
                this.baseY = yBase;
                this.colorOriginal = color;
                this.color = color;
                this.tamano = tamano;
                this.densidad = (Math.random() * 30) + 1;
                this.faseVibracion = Math.random() * Math.PI * 2;
                this.velocidadVibracion = Math.random() * 0.2 + 0.1;
            }

            actualizar() {
                this.faseVibracion += this.velocidadVibracion;
                let dx = raton.x - this.x;
                let dy = raton.y - this.y;
                let distancia = Math.sqrt(dx * dx + dy * dy);
                
                if (distancia < raton.radio && raton.x !== null) {
                    let fuerzaDireccionX = dx / distancia;
                    let fuerzaDireccionY = dy / distancia;
                    let fuerza = (raton.radio - distancia) / raton.radio;
                    let repulsionX = fuerzaDireccionX * fuerza * this.densidad;
                    let repulsionY = fuerzaDireccionY * fuerza * this.densidad;
                    this.x -= repulsionX;
                    this.y -= repulsionY;
                    const matiz = (this.faseVibracion * 80 + this.x + this.y) % 360;
                    this.color = `hsl(${matiz}, 100%, 75%)`;
                } else {
                    this.color = this.colorOriginal;
                    if (this.x !== this.baseX) this.x -= (this.x - this.baseX) / 10;
                    if (this.y !== this.baseY) this.y -= (this.y - this.baseY) / 10;
                }
                this.x += (Math.random() - 0.5) * 1.5; 
                this.y += (Math.random() - 0.5) * 1.5;
            }

            dibujar() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.tamano, this.tamano);
            }
        }

        function inicializarArchivoVivo(imagen) {
            particulas = [];
            const canvasTemp = document.createElement('canvas');
            const ctxTemp = canvasTemp.getContext('2d');
            const maxAncho = window.innerWidth < 768 ? window.innerWidth * 0.85 : 600; 
            let escala = 1;
            if (imagen.width > maxAncho) escala = maxAncho / imagen.width;
            canvasTemp.width = imagen.width * escala;
            canvasTemp.height = imagen.height * escala;
            ctxTemp.drawImage(imagen, 0, 0, canvasTemp.width, canvasTemp.height);
            const imageData = ctxTemp.getImageData(0, 0, canvasTemp.width, canvasTemp.height);
            const datos = imageData.data;
            const offsetX = (canvas.width - canvasTemp.width) / 2;
            const offsetY = (canvas.height - canvasTemp.height) / 2;
            const gap = window.innerWidth < 768 ? 2 : 3;

            actualizarPosicionSecreto();

            for (let y = 0; y < canvasTemp.height; y += gap) {
                for (let x = 0; x < canvasTemp.width; x += gap) {
                    const i = (y * canvasTemp.width + x) * 4;
                    if (datos[i + 3] > 64) {
                        const color = `rgba(${datos[i]}, ${datos[i+1]}, ${datos[i+2]}, ${datos[i+3] / 255})`;
                        particulas.push(new Particula(
                            Math.random() * canvas.width, 
                            Math.random() * canvas.height, 
                            x + offsetX, y + offsetY, 
                            color, 
                            Math.random() * 1.5 + 1
                        ));
                    }
                }
            }
        }

        function dibujarTextoSecreto() {
            const fontSize = window.innerWidth < 768 ? 12 : 16;
            const paddingX = 60;
            const paddingY = 30;
            ctx.save();
            ctx.font = `700 ${fontSize}px Montserrat`; 
            const txt = "Abri el universo";
            const textWidth = ctx.measureText(txt).width;
            boundsSecreto.w = textWidth + paddingX;
            boundsSecreto.h = fontSize + paddingY;
            if (isOverSecreto(raton.x, raton.y)) ctx.fillStyle = "white";
            else ctx.fillStyle = "#0a0a0a";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(txt, boundsSecreto.x, boundsSecreto.y);
            ctx.restore();
        }

        function animacionContinua() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (estado === 'cargando') {
                progresoCarga += (objetivoCarga - progresoCarga) * 0.05;
                let opacidadCarga = 1;
                if (objetivoCarga === 100 && progresoCarga > 90) opacidadCarga = Math.max(0, (100 - progresoCarga) / 10);
                
                ctx.globalAlpha = opacidadCarga;

                // Partículas de ambiente en carga
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                particulasCarga.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.fillRect(p.x, p.y, p.tamano, p.tamano);
                });

                // Dibujar Logo Centrado en el Cargador
                if (imgLogoCargador.complete) {
                    const logoW = window.innerWidth < 768 ? 100 : 150;
                    const logoH = (imgLogoCargador.height * logoW) / imgLogoCargador.width;
                    ctx.drawImage(imgLogoCargador, (canvas.width - logoW)/2, (canvas.height - logoH)/2 - 40, logoW, logoH);
                }

                // Texto de progreso debajo del logo
                ctx.fillStyle = '#ffffff';
                ctx.font = '400 12px Montserrat';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`[ SINTETIZANDO MEMBRANA: ${Math.floor(progresoCarga)}% ]`, canvas.width/2, canvas.height/2 + 60);
                
                ctx.globalAlpha = 1.0;

                if (progresoCarga > 99.5 && objetivoCarga === 100 && particulas.length > 0) {
                    estado = 'activo';
                    menuPrincipal.classList.add('visible');
                }
            } else if (estado === 'activo') {
                dibujarTextoSecreto();
                if (opacidadTransicion < 1) opacidadTransicion += 0.015;
                ctx.globalAlpha = Math.min(1, opacidadTransicion);
                for (let i = 0; i < particulas.length; i++) {
                    particulas[i].actualizar();
                    particulas[i].dibujar();
                }
                ctx.globalAlpha = 1.0;
            }
            animacionId = requestAnimationFrame(animacionContinua);

        function manifestarDesdeURL(url) {
            objetivoCarga = 85; 
            const img = new Image();
            img.onload = function() {
                objetivoCarga = 100; 
                setTimeout(() => inicializarArchivoVivo(img), 100);
            };

            img.onerror = function() {
                const canvasFallback = document.createElement('canvas');
                const ctxTemp = canvasFallback.getContext('2d');
                const fontSize = window.innerWidth < 768 ? 40 : 80;
                ctxTemp.font = `900 ${fontSize}px Montserrat`;
                const texto1 = "El Closet";
                const texto2 = "Expandido";
                const anchoMaximo = Math.max(ctxTemp.measureText(texto1).width, ctxTemp.measureText(texto2).width);
                canvasFallback.width = anchoMaximo + 40;
                canvasFallback.height = (fontSize * 2) + 60;
                const ctxF = canvasFallback.getContext('2d');
                ctxF.fillStyle = 'white';
                ctxF.font = `900 ${fontSize}px Montserrat`;
                ctxF.textAlign = 'left';
                ctxF.textBaseline = 'top';
                ctxF.fillText(texto1, 20, 20);
                ctxF.fillText(texto2, 20, fontSize + 30);
                const imgF = new Image();
                imgF.src = canvasFallback.toDataURL();
                imgF.onload = () => {
                    objetivoCarga = 100;
                    setTimeout(() => inicializarArchivoVivo(imgF), 100);
                };
            };
            img.src = url;
        }

        window.addEventListener('load', () => {
            document.fonts.ready.then(() => {
                redimensionarCanvas();
                animacionContinua(); 
                manifestarDesdeURL(RUTA_IMAGEN);
            });
        });
    </script>
