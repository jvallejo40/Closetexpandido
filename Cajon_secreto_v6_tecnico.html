<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cajón Secreto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #2b2019;
      --card-bg: #F1EDFF;
      --card-text: #4B3C81;
      --accent-color: #a48976;
      --header-text: #fdfaf4;
      --btn-bg: linear-gradient(135deg, #7a6252, #5f4a3e);
      --marker-color: #d9534f;
      --grid-color: #E1DDF0;
      --paper-blue: #234489;
      --paper-cream: #fdfaf4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      color: white;
    }

    #app-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-top: 20px;
    }

    #parallax-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .parallax-item {
      position: absolute;
      transition: transform 0.2s ease-out;
      will-change: transform;
      pointer-events: none;
    }

    #card-stage {
      flex-grow: 1;
      position: relative;
      perspective: 1500px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 135px;
      z-index: 2;
    }

    .card {
      position: absolute;
      width: 90%;
      max-width: 480px;
      max-height: calc(100vh - 185px);
      overflow-y: auto;
      padding: 35px 40px;
      background-color: var(--card-bg);
      color: var(--card-text);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      transition:
        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1),
        opacity 0.8s ease;
      opacity: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transform: translateZ(-800px) rotateY(30deg) scale(0.8);
      clip-path: url(#torn-paper);
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15px;
      bottom: 0;
      width: 2px;
      background-image:
        radial-gradient(
          circle at center,
          transparent 3px,
          var(--card-bg) 3px,
          var(--card-bg) 5px,
          transparent 5px
        );
      background-size: 100% 20px;
    }

    .card.is-active {
      opacity: 1;
      z-index: 2;
      transform: translateZ(0) rotateY(0deg) scale(1);
    }

    .card.is-exiting {
      opacity: 0;
      transform: translateZ(-400px) scale(0.9);
    }

    .card h2 {
      font-family: 'Caveat', cursive;
      color: var(--card-text);
      font-size: 2em;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    #input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      z-index: 5;
      transition: opacity 0.5s ease, transform 0.5s ease;
      opacity: 0;
      transform: translateY(100%);
    }

    #input-area.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .input-wrapper {
      max-width: 480px;
      margin: 0 auto;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--accent-color);
      border-radius: 25px;
      font-size: 15px;
      background: var(--card-bg);
      color: var(--card-text);
      font-family: 'Poppins', sans-serif;
    }

    .input-group textarea {
      border-radius: 15px;
      min-height: 110px;
      resize: vertical;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      outline: none;
      border-color: var(--card-text);
    }

    .card-input-area {
      margin-top: 20px;
    }

    .radio-option,
    .checkbox-option {
      display: flex;
      align-items: center;
      padding: 10px;
      border: 2px solid transparent;
      border-radius: 15px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      color: var(--card-text);
    }

    .radio-option:hover,
    .checkbox-option:hover {
      background: rgba(225, 221, 240, 0.5);
    }

    .radio-option input,
    .checkbox-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      appearance: none;
    }

    .custom-control {
      position: relative;
      width: 24px;
      height: 24px;
      border: 2px solid var(--accent-color);
      border-radius: 4px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .marker-x {
      width: 100%;
      height: 100%;
    }

    .marker-x .line {
      stroke: var(--marker-color);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 25;
      stroke-dashoffset: 25;
      transition: stroke-dashoffset 0.4s cubic-bezier(0.455,0.030,0.515,0.955);
    }

    .selected .marker-x .line1 {
      stroke-dashoffset: 0;
    }

    .selected .marker-x .line2 {
      stroke-dashoffset: 0;
      transition-delay: 0.2s;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 120px;
      padding: 14px 20px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }

    .btn-primary {
      background: var(--btn-bg);
      color: white;
    }

    .btn-secondary {
      background: var(--accent-color);
      color: var(--card-text);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .character-counter {
      color: var(--accent-color);
      margin-top: 8px;
      font-size: 12px;
      text-align: right;
      line-height: 1.4;
    }

    .error-message-inline {
      color: #ff8a80;
      font-size: 13px;
      margin-top: 8px;
      margin-bottom: 8px;
      text-align: center;
      width: 100%;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .radio-option label,
    .checkbox-option label {
      font-size: 14px;
      cursor: pointer;
      line-height: 1.4;
    }

    .summary-section {
      background: transparent;
      padding: 10px;
      border-radius: 15px;
      color: var(--card-text);
      border: 2px dashed var(--accent-color);
    }

    .summary-section h3 {
      color: var(--card-text);
      margin-bottom: 10px;
    }

    .summary-label {
      color: var(--accent-color);
      font-weight: 600;
    }

    .summary-value {
      color: var(--card-text);
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid rgba(144,134,180,0.3);
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .summary-item:hover {
      background-color: rgba(225,221,240,0.8);
    }

    .summary-item:last-child {
      border: none;
    }

    .summary-value.truncated {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .small-note {
      font-size: 12px !important;
      opacity: 0.82;
    }

    .processing-wrap {
      text-align: center;
      padding: 12px 0;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 22px auto;
      border-radius: 50%;
      border: 4px solid rgba(75,60,129,0.18);
      border-top-color: var(--card-text);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .poem-result {
      color: var(--paper-blue);
    }

    .poem-result .recipient {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .poem-result .poetic-feeling {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-style: italic;
      font-weight: 300;
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .poem-result .intro-title {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin: 14px 0 8px;
    }

    .poem-result .intro-copy {
      font-size: 12px;
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .poem-result .poem-copy {
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      margin-top: 14px;
    }

    .poem-result .timestamp {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 12px;
    }

    .qr-wrap {
      text-align: center;
      margin-top: 18px;
    }

    .qr-wrap img {
      width: 170px;
      height: 170px;
      max-width: 50vw;
      background: white;
      padding: 8px;
      cursor: pointer;
    }

    .qr-wrap p {
      font-size: 11px;
      margin-top: 7px;
    }

    .result-status {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed rgba(75,60,129,0.35);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 600px) {
      #card-stage {
        margin-bottom: 150px;
      }

      .card {
        padding: 25px;
        max-height: calc(100vh - 205px);
      }

      .card h2 {
        font-size: 1.8em;
      }

      .card p {
        font-size: 14px;
      }

      .btn {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="app-container">

    <div id="parallax-bg">
      <img
        src="https://www.jaimesiva.com/wp-content/uploads/2025/08/short-scaled.png"
        alt=""
        class="parallax-item"
        data-depth="0.3"
        style="width:650px;height:auto;"
      >
      <img
        src="https://www.jaimesiva.com/wp-content/uploads/2025/08/gorrofondo-scaled.png"
        alt=""
        class="parallax-item"
        data-depth="0.6"
        style="width:400px;height:auto;"
      >
      <img

        alt=""
        class="parallax-item"
        data-depth="0.8"
        style="width:400px;height:auto;"
      >
    </div>

    <div id="card-stage"></div>

    <div id="input-area">
      <div class="input-wrapper"></div>
    </div>

  </div>

  <svg style="position:absolute;width:0;height:0;">

      </clipPath>
    </defs>
  </svg>

  <script>
    /*
     * EL CAJÓN SECRETO — FRONTEND
     *
     * Esta URL debe ser la implementación WEB APP actualizada
     * de Google Apps Script.
     */
    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbwpxXbm7YedskJ617brV-_DUlWFOyUPYBzEG0v-DquZDNqF2xeA3L36Ap4D33hgDsnQ/exec';

    document.addEventListener('DOMContentLoaded', () => {

      let currentStep = 0;
      let participationId = null;
      let pollAttempts = 0;
      const MAX_POLL_ATTEMPTS = 120;

      const cardElements = [];

      const initialFormData = {
        terms: '',
        name: '',
        email: '',
        gender: '',
        orientation: '',
        story: '',
        timestamp: null
      };

      let formData = { ...initialFormData };

      const questions = [
        {
          id: 'terms',
          type: 'checkbox',
          message: `
            <h2>¿Tienes una historia que nunca te atreviste a contar?</h2>
            <p>Este es tu momento. Comparte conmigo ese secreto, esa anécdota, esa experiencia guardada.</p>
            <p><em>Haz clic para aceptar los términos y comenzar este viaje.</em></p>
          `,
          options: [
            {
              value: 'accept',
              label: 'He leído y acepto los términos y condiciones'
            }
          ],
          required: true,
          buttonText: 'Aceptar y continuar'
        },

        {
          id: 'name',
          type: 'text',
          message: `
            <h2>Dime tu nombre, o un apodo</h2>
            <p><em>Lo usaré para dirigirme a ti en la devolución de tu historia.</em></p>
          `,
          placeholder: 'Escribe tu nombre o apodo...',
          required: true,
          buttonText: 'Continuar'
        },

        {
          id: 'email',
          type: 'email',
          message: `
            <h2>¿Cuál es tu correo electrónico?</h2>
            <p><em>Es opcional. Si lo escribes, recibirás tu PDF por correo. Si lo dejas vacío, podrás conservarlo desde esta pantalla.</em></p>
          `,
          placeholder: 'correo@ejemplo.com',
          required: false,
          buttonText: 'Continuar'
        },

        {
          id: 'gender',
          type: 'radio',
          message: `
            <h2>Género</h2>
            <p><em>Esto me ayuda a usar los pronombres adecuados al escribir para ti.</em></p>
          `,
          options: [
            { value: 'masculino', label: 'Masculino' },
            { value: 'femenino', label: 'Femenino' },
            { value: 'neutro', label: 'Neutro' }
          ],
          required: true,
          buttonText: 'Continuar'
        },

        {
          id: 'orientation',
          type: 'radio',
          message: `
            <h2>Orientación sexual</h2>
            <p><em>Esta información ayuda a comprender las diversas experiencias humanas. Puedes elegir “Prefiero no decirlo”.</em></p>
          `,
          options: [
            { value: 'heterosexual', label: 'Heterosexual' },
            { value: 'homosexual', label: 'Homosexual' },
            { value: 'bisexual', label: 'Bisexual' },
            { value: 'pansexual', label: 'Pansexual' },
            { value: 'asexual', label: 'Asexual' },
            { value: 'demisexual', label: 'Demisexual' },
            { value: 'prefiero no decir', label: 'Prefiero no decirlo' }
          ],
          required: true,
          buttonText: 'Continuar'
        },

        {
          id: 'story',
          type: 'textarea',
          message: `
            <h2>Tu historia secreta</h2>
            <p><em>Lo que escribas aquí no será divulgado de forma literal. Escribe al menos 140 caracteres.</em></p>
          `,
          placeholder: 'Comparte tu historia aquí...',
          required: true,
          minLength: 140,
          buttonText: 'Continuar'
        },

        {
          id: 'summary',
          type: 'summary',
          message: `
            <h2>Revisa tu información</h2>
            <p><em>Confirma que todo esté correcto. Puedes tocar una respuesta para volver y editarla.</em></p>
          `,
          buttonText: 'Cerrar el cajón y enviar'
        },

        {
          id: 'processing',
          type: 'processing',
          message: `
            <div class="processing-wrap">
              <h2>He guardado tu historia</h2>
              <div class="spinner"></div>
              <p id="processing-message">Estoy leyendo tu historia y transformándola en una devolución poética.</p>
              <p class="small-note">No cierres esta ventana mientras preparo tu poema.</p>
            </div>
          `
        },

        {
          id: 'result',
          type: 'result',
          message: `<div id="result-content"></div>`
        },

        {
          id: 'failure',
          type: 'failure',
          message: `
            <h2>Tu historia quedó guardada</h2>
            <p>No pude completar la devolución en este momento.</p>
            <p>Tu relato quedó registrado para poder recuperarlo sin que tengas que escribirlo otra vez.</p>
            <p class="small-note" id="failure-id"></p>
          `
        }
      ];

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function initializeCards() {
        const stage = document.getElementById('card-stage');

        questions.forEach((q, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.step = index;
          card.innerHTML =
            `<div class="card-content">${q.message}</div>`;

          stage.appendChild(card);
          cardElements.push(card);
        });
      }

      function initParallax() {
        const items =
          document.querySelectorAll('.parallax-item');

        const container =
          document.getElementById('app-container');

        items.forEach(item => {
          const width = item.clientWidth || 300;
          const height = item.clientHeight || 300;

          const randomTop =
            Math.max(
              0,
              Math.random() *
              (container.clientHeight - height)
            );

          const randomLeft =
            Math.max(
              0,
              Math.random() *
              (container.clientWidth - width)
            );

          const randomRotate =
            (Math.random() - 0.5) * 40;

          item.style.top =
            `${randomTop}px`;

          item.style.left =
            `${randomLeft}px`;

          item.style.transform =
            `rotate(${randomRotate}deg)`;

          item.dataset.rotate =
            randomRotate;
        });

        const moveItems = (x, y) => {
          items.forEach(item => {
            const depth =
              Number(item.dataset.depth || 0);

            const initialRotate =
              Number(item.dataset.rotate || 0);

            const moveX =
              (x * depth) / 2;

            const moveY =
              (y * depth) / 2;

            item.style.transform =
              `translateX(${moveX}px) translateY(${moveY}px) rotate(${initialRotate}deg)`;
          });
        };

        container.addEventListener(
          'mousemove',
          e => {
            const x =
              e.clientX -
              window.innerWidth / 2;

            const y =
              e.clientY -
              window.innerHeight / 2;

            moveItems(x, y);
          }
        );

        window.addEventListener(
          'deviceorientation',
          e => {
            const y =
              Number(e.beta || 0) * 5;

            const x =
              Number(e.gamma || 0) * 5;

            moveItems(x, y);
          }
        );
      }

      function updateCardDisplay() {
        const inputArea =
          document.getElementById('input-area');

        cardElements.forEach(
          (card, index) => {
            card.classList.remove(
              'is-active',
              'is-exiting'
            );

            if (index === currentStep) {
              card.classList.add('is-active');
            } else if (index < currentStep) {
              card.classList.add('is-exiting');
            }
          }
        );

        const question =
          questions[currentStep];

        if (
          question.type === 'processing' ||
          question.type === 'result' ||
          question.type === 'failure'
        ) {
          inputArea.classList.remove(
            'is-visible'
          );

          inputArea.querySelector(
            '.input-wrapper'
          ).innerHTML = '';

          return;
        }

        renderInteractionAreas(question);

        setTimeout(
          () =>
            inputArea.classList.add(
              'is-visible'
            ),
          100
        );
      }

      function renderInteractionAreas(question) {
        const activeCard =
          cardElements[currentStep];

        const cardContent =
          activeCard.querySelector(
            '.card-content'
          );

        const inputWrapper =
          document.querySelector(
            '#input-area .input-wrapper'
          );

        activeCard
          .querySelector('.card-input-area')
          ?.remove();

        inputWrapper.innerHTML = '';

        let cardInputHtml = '';
        let bottomInputHtml = '';

        const markerSvg = `
          <svg class="marker-x" viewBox="0 0 20 20">
            <path class="line line1" d="M4,4 L16,16" />
            <path class="line line2" d="M16,4 L4,16" />
          </svg>
        `;

        const summaryItems = [
          { label: 'Nombre', key: 'name' },
          { label: 'Correo', key: 'email' },
          { label: 'Género', key: 'gender' },
          { label: 'Orientación', key: 'orientation' },
          { label: 'Historia', key: 'story' }
        ];

        switch (question.type) {

          case 'text':
          case 'email': {
            bottomInputHtml = `
              <div class="input-group">
                <input
                  type="${question.type}"
                  id="textInput"
                  placeholder="${question.placeholder}"
                  value="${escapeHtml(formData[question.id] || '')}"
                >
              </div>
            `;
            break;
          }

          case 'textarea': {
            bottomInputHtml = `
              <div class="input-group">
                <textarea
                  id="textInput"
                  placeholder="${question.placeholder}"
                >${escapeHtml(formData[question.id] || '')}</textarea>
                <div class="character-counter" id="charCounter"></div>
              </div>
            `;
            break;
          }

          case 'radio':
          case 'checkbox': {
            const groupClass =
              question.type + '-group';

            const optionClass =
              question.type + '-option';

            const optionsHtml =
              question.options
                .map((opt, i) => {
                  const selected =
                    formData[question.id] ===
                    opt.value;

                  return `
                    <div
                      class="${optionClass} ${selected ? 'selected' : ''}"
                      onclick="selectOption(this,'${question.type}')"
                    >
                      <input
                        type="${question.type}"
                        name="${question.id}"
                        value="${escapeHtml(opt.value)}"
                        id="option_${currentStep}_${i}"
                        ${selected ? 'checked' : ''}
                      >
                      <span class="custom-control">
                        ${markerSvg}
                      </span>
                      <label for="option_${currentStep}_${i}">
                        ${escapeHtml(opt.label)}
                      </label>
                    </div>
                  `;
                })
                .join('');

            cardInputHtml = `
              <div class="card-input-area">
                <div class="${groupClass}">
                  ${optionsHtml}
                </div>
              </div>
            `;
            break;
          }

          case 'summary': {
            const summaryHtml =
              summaryItems
                .map(item => {
                  const stepIndex =
                    questions.findIndex(
                      q => q.id === item.key
                    );

                  let value =
                    formData[item.key];

                  if (
                    item.key === 'email' &&
                    !value
                  ) {
                    value =
                      'No proporcionado';
                  }

                  return `
                    <div
                      class="summary-item"
                      onclick="jumpToStep(${stepIndex})"
                    >
                      <span class="summary-label">
                        ${escapeHtml(item.label)}:
                      </span>
                      <span
                        class="summary-value truncated"
                        title="${escapeHtml(value || '')}"
                      >
                        ${escapeHtml(value || 'No especificado')}
                      </span>
                    </div>
                  `;
                })
                .join('');

            cardInputHtml = `
              <div class="card-input-area">
                <div class="summary-section">
                  <h3>Tu resumen</h3>
                  ${summaryHtml}
                </div>

                <div style="margin-top:15px;">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="downloadOriginalStory()"
                  >
                    Descargar mi historia
                  </button>
                </div>
              </div>
            `;
            break;
          }
        }

        if (cardInputHtml) {
          cardContent.insertAdjacentHTML(
            'beforeend',
            cardInputHtml
          );
        }

        const backButton =
          currentStep > 0
            ? `
              <button
                class="btn btn-secondary"
                onclick="handleBack()"
              >
                Atrás
              </button>
            `
            : '';

        inputWrapper.innerHTML = `
          ${bottomInputHtml}

          <div
            id="error-message"
            class="error-message-inline"
          ></div>

          <div class="action-buttons">
            ${backButton}

            <button
              id="nextBtn"
              class="btn btn-primary"
            >
              ${question.buttonText}
            </button>
          </div>
        `;

        const nextButton =
          document.getElementById('nextBtn');

        if (nextButton) {
          nextButton.onclick =
            handleNext;
        }

        if (
          question.type ===
          'textarea'
        ) {
          const textarea =
            document.getElementById(
              'textInput'
            );

          const charCounter =
            document.getElementById(
              'charCounter'
            );

          const updateCounter = () => {
            const len =
              textarea.value.length;

            if (
              len <
              question.minLength
            ) {
              charCounter.textContent =
                `Escribe al menos ${question.minLength} caracteres.`;
            } else {
              charCounter.textContent =
                `${len} caracteres`;
            }
          };

          textarea.addEventListener(
            'input',
            updateCounter
          );

          updateCounter();
        }
      }

      window.selectOption =
        (element, type) => {

          if (type === 'radio') {
            element
              .parentElement
              .querySelectorAll(
                '.radio-option'
              )
              .forEach(el =>
                el.classList.remove(
                  'selected'
                )
              );

            element.classList.add(
              'selected'
            );

          } else {
            element.classList.toggle(
              'selected'
            );
          }

          const input =
            element.querySelector(
              'input'
            );

          input.checked =
            element.classList.contains(
              'selected'
            );
        };

      window.handleBack = () => {
        if (currentStep > 0) {
          saveCurrentFieldIfPossible();
          currentStep--;
          updateCardDisplay();
        }
      };

      window.jumpToStep = step => {
        currentStep = step;
        updateCardDisplay();
      };

      function saveCurrentFieldIfPossible() {
        const question =
          questions[currentStep];

        if (!question) {
          return;
        }

        if (
          question.type === 'text' ||
          question.type === 'email' ||
          question.type === 'textarea'
        ) {
          const input =
            document.getElementById(
              'textInput'
            );

          if (input) {
            formData[question.id] =
              input.value.trim();
          }
        }
      }

      async function handleNext() {
        const question =
          questions[currentStep];

        const errorDiv =
          document.getElementById(
            'error-message'
          );

        if (errorDiv) {
          errorDiv.textContent = '';
        }

        let value = '';

        switch (question.type) {

          case 'text':
          case 'email':
          case 'textarea': {
            const input =
              document.getElementById(
                'textInput'
              );

            value =
              input.value.trim();

            if (
              question.required &&
              !value
            ) {
              errorDiv.textContent =
                'Este campo es obligatorio.';
              return;
            }

            if (
              question.type === 'email' &&
              value &&
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
            ) {
              errorDiv.textContent =
                'Por favor, ingresa un correo válido o deja el campo vacío.';
              return;
            }

            if (
              question.minLength &&
              value.length <
              question.minLength
            ) {
              errorDiv.textContent =
                `Debe tener al menos ${question.minLength} caracteres.`;
              return;
            }

            break;
          }

          case 'radio': {
            const radio =
              document.querySelector(
                `input[name="${question.id}"]:checked`
              );

            if (
              question.required &&
              !radio
            ) {
              errorDiv.textContent =
                'Debes seleccionar una opción.';
              return;
            }

            value =
              radio
                ? radio.value
                : '';

            break;
          }

          case 'checkbox': {
            const cb =
              document.querySelector(
                `input[name="${question.id}"]:checked`
              );

            if (
              question.required &&
              !cb
            ) {
              errorDiv.textContent =
                'Debes aceptar los términos.';
              return;
            }

            value =
              cb
                ? cb.value
                : '';

            break;
          }

          case 'summary':
            await handleSubmit();
            return;
        }

        formData[question.id] =
          value;

        document
          .getElementById(
            'input-area'
          )
          .classList.remove(
            'is-visible'
          );

        setTimeout(
          () => {
            currentStep++;
            updateCardDisplay();
          },
          350
        );
      }

      function createId() {
        if (
          window.crypto &&
          crypto.randomUUID
        ) {
          return crypto.randomUUID();
        }

        return (
          'closet-' +
          Date.now() +
          '-' +
          Math.random()
            .toString(16)
            .slice(2)
        );
      }

      async function handleSubmit() {
        const submitBtn =
          document.getElementById(
            'nextBtn'
          );

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent =
            'Guardando...';
        }

        participationId =
          createId();

        formData.timestamp =
          new Date().toISOString();

        const payload = {
          id: participationId,
          terms: 'accept',
          name: formData.name,
          email: formData.email || '',
          gender: formData.gender,
          orientation:
            formData.orientation,
          story: formData.story,
          timestamp:
            formData.timestamp
        };

        currentStep =
          questions.findIndex(
            q => q.id === 'processing'
          );

        updateCardDisplay();

        const processingMessage =
          document.getElementById(
            'processing-message'
          );

        if (processingMessage) {
          processingMessage.textContent =
            'He guardado tu envío. Estoy preparando tu devolución.';
        }

        /*
         * Envío POST.
         *
         * text/plain evita preflight.
         * no-cors es compatible con
         * Google Apps Script Web Apps.
         */
        try {
          await fetch(
            SCRIPT_URL,
            {
              method: 'POST',
              mode: 'no-cors',
              headers: {
                'Content-Type':
                  'text/plain;charset=UTF-8'
              },
              body:
                JSON.stringify(
                  payload
                )
            }
          );
        } catch (error) {
          console.warn(
            'El navegador no pudo leer la respuesta POST; se consultará el estado por ID.',
            error
          );
        }

        pollAttempts = 0;
        pollStatus();
      }

      function pollStatus() {
        pollAttempts++;

        if (
          pollAttempts >
          MAX_POLL_ATTEMPTS
        ) {
          showFailure(
            'El procesamiento está tardando más de lo esperado.'
          );
          return;
        }

        const callbackName =
          'closetStatus_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 100000
          );

        const script =
          document.createElement(
            'script'
          );

        let finished = false;

        const cleanup = () => {
          if (finished) {
            return;
          }

          finished = true;

          try {
            delete window[
              callbackName
            ];
          } catch (_) {}

          try {
            script.remove();
          } catch (_) {}
        };

        const timeout =
          setTimeout(
            () => {
              cleanup();

              setTimeout(
                pollStatus,
                1800
              );
            },
            10000
          );

        window[callbackName] =
          data => {
            clearTimeout(timeout);
            cleanup();

            if (
              !data ||
              !data.ok
            ) {
              setTimeout(
                pollStatus,
                1800
              );
              return;
            }

            if (!data.found) {
              updateProcessingMessage(
                'Tu historia está entrando al cajón...'
              );

              setTimeout(
                pollStatus,
                1600
              );

              return;
            }

            const status =
              String(
                data.status || ''
              );

            if (
              status ===
              'COMPLETADO'
            ) {
              showResult(data);
              return;
            }

            if (
              status ===
              'ERROR_EMAIL'
            ) {
              /*
               * El poema y PDF existen.
               * Solo falló el correo.
               */
              showResult(data);
              return;
            }

            if (
              status ===
              'ERROR_GENERACION' ||
              status ===
              'ERROR_PDF'
            ) {
              showFailure(
                data.error ||
                status
              );
              return;
            }

            if (
              status ===
              'RECIBIDO'
            ) {
              updateProcessingMessage(
                'Tu historia ya está guardada. Estoy preparándola para la lectura.'
              );
            }

            if (
              status ===
              'PROCESANDO'
            ) {
              updateProcessingMessage(
                'Estoy transformando tu historia en una devolución poética.'
              );
            }

            setTimeout(
              pollStatus,
              1700
            );
          };

        script.onerror =
          () => {
            clearTimeout(timeout);
            cleanup();

            setTimeout(
              pollStatus,
              2000
            );
          };

        script.src =
          SCRIPT_URL +
          '?action=status' +
          '&id=' +
          encodeURIComponent(
            participationId
          ) +
          '&callback=' +
          encodeURIComponent(
            callbackName
          ) +
          '&_=' +
          Date.now();

        document.body.appendChild(
          script
        );
      }

      function updateProcessingMessage(
        message
      ) {
        const element =
          document.getElementById(
            'processing-message'
          );

        if (element) {
          element.textContent =
            message;
        }
      }

      function showResult(data) {
        const resultIndex =
          questions.findIndex(
            q => q.id === 'result'
          );

        currentStep =
          resultIndex;

        const resultCard =
          cardElements[resultIndex];

        const content =
          resultCard.querySelector(
            '.card-content'
          );

        const pdfTarget =
          data.pdf_download_url ||
          data.pdf_url ||
          '';

        const qrUrl =
          data.qr_text_url ||
          '';

        const emailText =
          formData.email
            ? (
                data.email_sent
                  ? 'También envié una copia de este PDF al correo que registraste.'
                  : 'Tu PDF está listo. No fue posible completar el envío por correo, pero puedes conservarlo aquí.'
              )
            : 'Como no registraste un correo, puedes conservar tu PDF directamente desde esta pantalla.';

        content.innerHTML = `
          <div class="poem-result">

            <div class="recipient">
              ${escapeHtml(formData.name || 'Para ti')}
            </div>

            <div class="poetic-feeling">
              ${escapeHtml(data.poetic_phrase || '')}
            </div>

            <div class="intro-title">
              Antes de leer mi poema para ti
            </div>

            <div class="intro-copy">
              Permíteme hablarte sobre el concepto de texto.
              Un texto no reside únicamente en las palabras escritas:
              también puede ser visual, sonoro, pictórico o material.
              Todo aquello que comunica una idea, una experiencia o una emoción
              puede convertirse en texto. Esta devolución transforma tu historia
              en otra forma de lenguaje dentro de <em>El Clóset Expandido</em>.
            </div>

            <div class="poem-copy">
              ${escapeHtml(data.poem || '')}
            </div>

            <div class="timestamp">
              ${escapeHtml(
                new Date()
                  .toLocaleString(
                    'es-CO'
                  )
              )}
            </div>

            ${
              qrUrl
                ? `
                  <div class="qr-wrap">
                    <img
                      id="result-qr"
                      src="${escapeHtml(qrUrl)}"
                      alt="Código QR para conservar el PDF"
                    >
                    <p>
                      Toca el QR para abrir y conservar el mismo PDF.
                    </p>
                  </div>
                `
                : ''
            }

            <div class="result-status">
              ${escapeHtml(emailText)}
            </div>

          </div>
        `;

        updateCardDisplay();

        const inputArea =
          document.getElementById(
            'input-area'
          );

        const wrapper =
          inputArea.querySelector(
            '.input-wrapper'
          );

        wrapper.innerHTML = `
          <div class="action-buttons">

            ${
              pdfTarget
                ? `
                  <a
                    id="keep-pdf"
                    class="btn btn-primary"
                    href="${escapeHtml(pdfTarget)}"
                    target="_blank"
                    rel="noopener"
                  >
                    Conservar mi PDF
                  </a>
                `
                : ''
            }

            <button
              type="button"
              class="btn btn-secondary"
              onclick="downloadOriginalStory()"
            >
              Descargar mi historia
            </button>

            <button
              type="button"
              class="btn btn-secondary"
              onclick="restartApp()"
            >
              Enviar otra historia
            </button>

          </div>
        `;

        inputArea.classList.add(
          'is-visible'
        );

        const qr =
          document.getElementById(
            'result-qr'
          );

        if (
          qr &&
          pdfTarget
        ) {
          qr.addEventListener(
            'click',
            () => {
              window.open(
                pdfTarget,
                '_blank',
                'noopener'
              );
            }
          );
        }
      }

      function showFailure(message) {
        const failureIndex =
          questions.findIndex(
            q => q.id === 'failure'
          );

        currentStep =
          failureIndex;

        updateCardDisplay();

        const idNode =
          document.getElementById(
            'failure-id'
          );

        if (idNode) {
          idNode.textContent =
            'Identificador: ' +
            participationId;
        }

        console.error(
          'Cajón Secreto:',
          message
        );

        const inputArea =
          document.getElementById(
            'input-area'
          );

        const wrapper =
          inputArea.querySelector(
            '.input-wrapper'
          );

        wrapper.innerHTML = `
          <div class="action-buttons">

            <button
              type="button"
              class="btn btn-secondary"
              onclick="downloadOriginalStory()"
            >
              Descargar mi historia
            </button>

            <button
              type="button"
              class="btn btn-primary"
              onclick="restartApp()"
            >
              Volver a empezar
            </button>

          </div>
        `;

        inputArea.classList.add(
          'is-visible'
        );
      }

      window.downloadOriginalStory =
        () => {
          const content = [
            'EL CLÓSET EXPANDIDO — MI HISTORIA',
            '',
            'Nombre o apodo: ' +
              (formData.name || ''),
            'Fecha: ' +
              new Date()
                .toLocaleString(
                  'es-CO'
                ),
            '',
            formData.story || ''
          ].join('\n');

          const blob =
            new Blob(
              [content],
              {
                type:
                  'text/plain;charset=utf-8'
              }
            );

          const url =
            URL.createObjectURL(
              blob
            );

          const anchor =
            document.createElement(
              'a'
            );

          anchor.href =
            url;

          anchor.download =
            'mi-historia-closet-expandido.txt';

          document.body.appendChild(
            anchor
          );

          anchor.click();
          anchor.remove();

          setTimeout(
            () =>
              URL.revokeObjectURL(
                url
              ),
            1000
          );
        };

      window.restartApp =
        () => {
          currentStep = 0;
          participationId = null;
          pollAttempts = 0;
          formData = {
            ...initialFormData
          };

          updateCardDisplay();
        };

      initializeCards();
      updateCardDisplay();
      initParallax();
    });
  </script>
</body>
</html>
